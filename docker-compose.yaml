services:
  nagadb:
    image: ghcr.io/rimorastudio/nagadb:1.11.2
    ports:
      - "4100:4100"
    environment:
      # optional — auto-generated and persisted in the /data volume if unset
      NAGADB_SECRET_KEY: ${SERVICE_PASSWORD_NAGADB:-${NAGADB_SECRET_KEY:-}}
      NAGADB_EDITION: ${NAGADB_EDITION:-community}
      NAGADB_ADMIN_EMAIL: ${NAGADB_ADMIN_EMAIL:-}
      NAGADB_ADMIN_PASSWORD: ${NAGADB_ADMIN_PASSWORD:-}
      SQLITE_PATH: /data/nagadb.db
      LOG_LEVEL: info
      # optional: shell command run after each backup, {file} = dump path
      # e.g. rclone copy {file} r2:nagadb-backups
      BACKUP_OFFLOAD_CMD: ${BACKUP_OFFLOAD_CMD:-}
    volumes:
      - nagadb-data:/data
    restart: unless-stopped

volumes:
  nagadb-data:
